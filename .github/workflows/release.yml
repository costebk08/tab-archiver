name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TAB_ARCHIVER_GITHUB_REPO: ${{ github.repository }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build Windows executable
        run: pyinstaller packaging/tab_archiver.spec --noconfirm

      - name: Package Windows release
        run: |
          Copy-Item packaging/INSTALL.txt dist/INSTALL.txt
          Compress-Archive -Path "dist/Tab Archiver.exe","dist/INSTALL.txt" -DestinationPath "Tab-Archiver-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Tab-Archiver-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build macOS app
        run: pyinstaller packaging/tab_archiver_mac.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname "Tab Archiver" -srcfolder "dist/Tab Archiver.app" -ov -format UDZO "Tab-Archiver-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Tab-Archiver-macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build Linux executable
        run: pyinstaller packaging/tab_archiver.spec --noconfirm

      - name: Package Linux release
        run: |
          tar -czf Tab-Archiver-Linux.tar.gz -C dist "Tab Archiver"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Tab-Archiver-Linux.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/Tab-Archiver-Windows.zip
            artifacts/macos/Tab-Archiver-macOS.dmg
            artifacts/linux/Tab-Archiver-Linux.tar.gz

  pages:
    runs-on: ubuntu-latest
    needs:
      - publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
